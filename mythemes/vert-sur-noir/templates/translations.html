{% if article.translations %}
<span class="tags">
  {% for translation in article.translations %}
  <a href="{{ SITEURL }}/{{ translation.url }}" hreflang="{{ LANG_CODES.get(translation.lang, translation.lang) if LANG_CODES else translation.lang }}"><i class="fa-solid fa-language"></i>{{ translation.lang }}</a>
  {% endfor %}
</span>
{% endif %}
